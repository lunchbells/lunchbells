<!DOCTYPE html>
<html lang="en">
<head>
  <title>lunchbells</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: white;
      color: black;
      font-family: Helvetica, sans-serif;
      font-size: 9pt;
      letter-spacing: 0.08em;
    }

    header {
      padding: 36px 20px 28px;
    }

    header h1 {
      font-size: 18pt;
      font-weight: normal;
      letter-spacing: normal;
    }

    header h1 a {
      color: black;
      text-decoration: none;
    }

    .layout {
      display: grid;
      grid-template-columns: 220px 1fr 260px;
      min-height: calc(100vh - 100px);
      padding: 0 20px;
    }

    .col-nav {
      padding: 0 20px 40px 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .nav-section {
      margin-bottom: 20px;
    }

    .nav-section ul {
      list-style: none;
    }

    .nav-section ul li {
      margin-bottom: 2pt;
      margin-top: 2pt;
    }

    .nav-section ul li a {
      font-size: 9pt;
      color: #999;
      text-decoration: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .nav-section ul li a:hover { color: black; }
    .nav-section ul li a.active { color: black; }

    .nav-bottom { margin-top: auto; }

    .col-images {
      padding: 0 20px;
      display: none;
      justify-content: center;
      align-items: flex-start;
    }

    .col-images.visible { display: flex; }

    .img-placeholder {
      width: 80%;
      height: calc(80vh - 100px);
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9pt;
      color: #999;
      letter-spacing: 0.1em;
    }

    .col-images img {
      width: 80%;
      height: calc(80vh - 100px);
      object-fit: contain;
      display: block;
    }

    .col-desc {
      padding: 0 10px 40px 20px;
      display: none;
    }

    .col-desc.visible { display: block; }

    .lookbook-label {
      font-size: 9pt;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 10px;
    }

    #gallery-nav {
      display: none;
      margin-bottom: 20px;
      font-size: 9pt;
      letter-spacing: 0.1em;
    }

    #gallery-counter {
      margin-right: 12px;
      color: black;
    }

    #gallery-nav button {
      font-family: Helvetica, sans-serif;
      font-size: 9pt;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: white;
      color: #999;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    #gallery-nav button:hover { color: black; }

    #gallery-nav .divider {
      color: #999;
      margin: 0 6px;
    }

    .col-desc p {
      font-size: 9pt;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      line-height: 1.8;
      margin-bottom: 2pt;
      margin-top: 2pt;
      color: black;
    }

    .col-desc .price {
      color: #999;
      margin-bottom: 2pt;
      margin-top: 2pt;
    }

    .col-desc button.add-to-cart {
      font-family: Helvetica, sans-serif;
      font-size: 9pt;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: white;
      color: #999;
      border: none;
      padding: 0;
      cursor: pointer;
      margin-top: 2pt;
      margin-bottom: 2pt;
    }

    .col-desc button.add-to-cart:hover { color: black; }

    .special-btn {
      display: block;
      font-family: Helvetica, sans-serif;
      font-size: 9pt;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: white;
      color: #999;
      border: none;
      padding: 0;
      cursor: pointer;
      margin-bottom: 2pt;
      margin-top: 2pt;
    }

    .special-btn:hover { color: black; }

    footer {
      padding: 20px 30px;
      font-size: 8pt;
      color: #bbb;
      letter-spacing: 0.08em;
    }

    @media (max-width: 768px) {
      .layout { display: block; padding: 0 16px; }
      .col-nav { padding: 0 0 24px; }
      .col-images { padding: 0 0 24px; }
      .col-images.visible { display: block; }
      .img-placeholder { width: 100%; height: 60vw; }
      .col-images img { width: 100%; height: 60vw; }
      .col-desc { padding: 0 0 24px; }
    }

    .home-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      align-content: start;
    }

    .home-grid-item {
      aspect-ratio: 3/4;
      width: 50%;
      background: #f0f0f0;
    }
  </style>
</head>
