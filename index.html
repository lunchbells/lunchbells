<!DOCTYPE html>
<head>
    </head>
<title>
    lunch bells
</title>
<style>
    title {
      margin: 0.5;
      font-family: Helvetica, sans-serif;
      display: flex;
      flex-direction: row;
      min-height: 100vh;
    }
    
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: row;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background-color: #fff;
      padding: 20px;
      box-sizing: border-box;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar li {
      margin-bottom: 10px;
      cursor: pointer;
      color: #000;
      font-size: 14px;
    }

    .sidebar li:hover {
      text-decoration: underline;
    }

    .content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .work-images {
      display: none;
    }

    .work-images.active {
      display: block;
    }

    .work-item {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: flex-start;
      gap: 30px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

   .caption {
  font-size: 14px;
  line-height: 1.5;
  flex: 1; 
}


    .caption em {
      font-style: italic;
    }

    .image-gallery {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .image-gallery img {
      height: auto;
      margin-bottom: 10px; 
      border-radius: 0px;
    }

    .landscape-img {
      width: 90%;
      max-width: 700px;
    }

    .portrait-img {
      width: 100%;
      max-width: 500px; /* Increased size for portrait */
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        border-bottom: 1px solid #ccc;
      }

      .sidebar ul {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .sidebar li {
        flex: 1 1 auto;
      }

      .content {
        padding: 15px;
      }

      .work-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .image-gallery {
        align-items: flex-start;
      }

      .landscape-img, .portrait-img {
        width: 100% !important;
        max-width: none !important;
      }
</style>
<body>
    
</body>
</html>
