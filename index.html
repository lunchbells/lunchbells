<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lunch-bells</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #ffffff;
      color: #222222;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Top spacer (the original uses a transparent spacer image here) */
    .spacer { height: 24px; }

    /* Slideshow: 4 slides stacked on top of each other, one visible at a time */
    .slideshow {
      position: relative;
      width: min(90vw, 720px);
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #e6e6e6;
      border: 1px solid #cfcfcf;
    }
    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8a8a8a;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .slide.active { opacity: 1; }
    .slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Language selector row below the image */
    .languages {
      display: grid;
      grid-template-columns: repeat(3, auto);
      justify-content: center;
      gap: 10px 28px;
      margin: 24px 0 40px;
      padding: 0;
      list-style: none;
      text-align: center;
    }
    .languages a {
      color: #444444;
      text-decoration: none;
      font-size: 0.95rem;
    }
    .languages a:hover,
    .languages a:focus { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="spacer"></div>

  <!-- To use real photos, replace the text inside each .slide with:
       <img src="photo1.jpg" alt="Describe the image"> -->
  <div class="slideshow" role="region" aria-roledescription="carousel" aria-label="Image slideshow">
    <div class="slide active" style="background:#e6e6e6">Image 1 placeholder</div>
    <div class="slide" style="background:#dcdcdc">Image 2 placeholder</div>
    <div class="slide" style="background:#d2d2d2">Image 3 placeholder</div>
    <div class="slide" style="background:#c8c8c8">Image 4 placeholder</div>
  </div>

  <ul class="languages">
    <li><a href="index.html?lang=de">Deutsch</a></li>
    <li><a href="index.html?lang=en">English</a></li>
    <li><a href="index.html?lang=es">Español</a></li>
    <li><a href="index.html?lang=pt">Português</a></li>
    <li><a href="index.html?lang=fr">Français</a></li>
    <li><a href="index.html?lang=it">Italiano</a></li>
  </ul>

  <script>
    (function () {
      var slides = document.querySelectorAll('.slideshow .slide');
      var current = 0;
      var DELAY = 7000; // milliseconds between automatic slide changes

      function show(n) {
        current = (n + slides.length) % slides.length;
        slides.forEach(function (s, i) { s.classList.toggle('active', i === current); });
      }

      show(0);
      
        setInterval(function () { show(current + 1); }, DELAY);
      }
    })();
  </script>
</body>
</html>
